{% extends "pages/base.html" %}

{% load static %}

{% block title %}
    Login Page
{% endblock %}

{% block content %}
<h2 id="h2">Login</h2>
    <div id="one">

        <form action ="{% url 'login' %}" method="post" id="b">
            {% csrf_token %}
            <h3>User Fields</h3>
            <label for="email">Email</label>
            <input type="email" class="word" name="email" required>
            <label for="password">Password</label>
            <input type="password" class="word" name="password" required>
            <button>Login</button>
        </form>
    </div>
{% endblock %}
